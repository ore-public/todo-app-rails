name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  # PR へのコメントは、このリポジトリのブランチから作った PR だけで行う。
  # フォークと Dependabot の PR ではトークンが読み取り専用になり、コメントを投稿できないため
  PR_COMMENT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install node modules
        run: bun install --frozen-lockfile

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'lib/rubocop/**/*.rb', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Set up reviewdog
        if: env.PR_COMMENT == 'true'
        uses: reviewdog/action-setup@v1

      # PR で変更した行への指摘を、PR のレビューコメントとして付ける。検査の成否は後のステップで判定する
      - name: Comment lint results on the pull request
        if: env.PR_COMMENT == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 検査で違反があっても、すべてのツールの結果をコメントする
          set +o pipefail
          bin/rubocop | reviewdog -f=rubocop -name=RuboCop -reporter=github-pr-review -fail-level=none
          bundle exec haml-lint | reviewdog -f=haml-lint -name=haml-lint -reporter=github-pr-review -fail-level=none
          bunx eslint | reviewdog -f=eslint -name=ESLint -reporter=github-pr-review -fail-level=none
          bun run --silent stylelint 2>&1 | reviewdog -f=stylelint -name=stylelint -reporter=github-pr-review -fail-level=none

      - name: Lint Ruby
        if: ${{ !cancelled() }}
        run: bin/rubocop -f github

      - name: Lint Haml
        if: ${{ !cancelled() }}
        run: bundle exec haml-lint

      - name: Lint JavaScript
        if: ${{ !cancelled() }}
        run: bun run eslint

      - name: Lint stylesheets
        if: ${{ !cancelled() }}
        run: bun run stylelint

      - name: Check locale files
        if: ${{ !cancelled() }}
        run: bundle exec i18n-tasks health

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install node modules
        run: bun install --frozen-lockfile

      - name: Set up reviewdog
        if: env.PR_COMMENT == 'true'
        uses: reviewdog/action-setup@v1

      - name: Comment Brakeman results on the pull request
        if: env.PR_COMMENT == 'true'
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +o pipefail
          bin/brakeman --quiet --no-pager --format tabs --no-exit-on-warn --no-exit-on-error |
            reviewdog -f=brakeman -name=Brakeman -reporter=github-pr-review -fail-level=none

      - name: Scan for common Rails security vulnerabilities using static analysis
        if: ${{ !cancelled() }}
        run: bin/brakeman --no-pager --exit-on-warn --exit-on-error

      - name: Scan for known security vulnerabilities in gems used
        if: ${{ !cancelled() }}
        run: bin/bundler-audit

      - name: Scan for known security vulnerabilities in node modules used
        if: ${{ !cancelled() }}
        run: bun audit

  db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check that db/schema.rb matches the migrations
        run: |
          bin/rails db:migrate
          git diff --exit-code db/schema.rb

      - name: Check consistency between models and the database schema
        if: ${{ !cancelled() }}
        run: bundle exec database_consistency

      - name: Check autoloading
        if: ${{ !cancelled() }}
        run: bin/rails zeitwerk:check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      RAILS_ENV: test
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # undercover が PR の変更元のブランチとの差分を調べるため
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install node modules
        run: bun install --frozen-lockfile

      - name: Install Chrome for system specs
        run: bunx playwright install --with-deps chrome

      - name: Build assets
        run: |
          bun run build
          bin/rails dartsass:build

      - name: Run specs with coverage
        run: |
          bin/rails db:test:prepare
          COVERAGE=true bin/rspec

      - name: Write coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/coverage.json') != '' }}
        run: |
          ruby script/ci/coverage_summary.rb > tmp/coverage_summary.md
          cat tmp/coverage_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment coverage summary on the pull request
        if: ${{ !cancelled() && env.PR_COMMENT == 'true' && hashFiles('tmp/coverage_summary.md') != '' }}
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: tmp/coverage_summary.md

      - name: Set up reviewdog
        if: ${{ !cancelled() && env.PR_COMMENT == 'true' }}
        uses: reviewdog/action-setup@v1

      # PR で変更したメソッドやブロックのうち、spec で実行されていない行にコメントを付ける
      - name: Comment uncovered changes on the pull request
        if: ${{ !cancelled() && env.PR_COMMENT == 'true' && hashFiles('coverage/coverage.json') != '' }}
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +o pipefail
          bundle exec undercover --compare "origin/${{ github.base_ref }}" --format json |
            ruby script/ci/undercover_rdjson.rb |
            reviewdog -f=rdjson -name=undercover -reporter=github-pr-review -filter-mode=diff_context -fail-level=none

      - name: Keep screenshots from failed system specs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore

      - name: Keep coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: ${{ github.workspace }}/coverage
          if-no-files-found: ignore
