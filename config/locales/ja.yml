    models:
      tag: タグ
      todo: todo
      user: ユーザー
  date:
    formats:
      month_day: "%-m/%-d(%a)"
  layouts:
    application:
      title: Tag Todo
    header:
      logo: tag todo
      sign_out: ログアウト
    help:
      close: 閉じる
      open: キーボード操作のヘルプ
      quick_entry_hint_html: '追加欄では <code>#タグ</code> <code>@実施日</code> <code>!期限</code>
        を指定できます（例: <code>資料作成 #仕事 @tomorrow !+3d</code>）'
      shortcuts:
      - description: カーソルを下 / 上に移動
        keys: j / k
      - description: 先頭 / 末尾に移動
        keys: g / G
      - description: 実施日を 1 日後 / 1 日前にする（未設定なら今日にする）
        keys: Ctrl + j / Ctrl + k
      - description: 完了 / 未完了を切り替え
        keys: x
      - description: 編集
        keys: Enter / e
      - description: タグを編集
        keys: t
      - description: 削除
        keys: d
      - description: 新規追加の入力欄に移動
        keys: o
      - description: タグの絞り込みに移動
        keys: "/"
      - description: 完了済みの表示 / 非表示を切り替え
        keys: c
      - description: このヘルプを表示
        keys: "?"
      - description: ダイアログを閉じる / 入力欄から抜ける
        keys: Esc
      title: キーボード操作
